<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Thu Chi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Only needed for the standalone (Netlify) version — login via Google through Auth0. Harmless if left in. -->
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.4/auth0-spa-js.production.js"></script>
</head>
<body>
<style>
:root{
  --bg:#f7f5ee; --surface:#fffffe; --surface-2:#f1eee2; --line:#e4dfcf;
  --ink:#18150f; --ink-2:#5b5a52; --muted:#8b8a80;
  --accent:#0f6b5c; --accent-strong:#0b5044; --accent-soft:#deefe9; --accent-ink:#ffffff;
  --gold:#96631d; --gold-soft:#f4e7cc;
  --pos:#006300; --pos-soft:#dcefdd;
  --neg:#a8341f; --neg-soft:#fbe6e0;
  --st-good:#0ca30c; --st-good-soft:rgba(12,163,12,.14);
  --st-warn:#c98500; --st-warn-soft:rgba(250,178,25,.22);
  --st-crit:#d03b3b; --st-crit-soft:rgba(208,59,59,.14);
  --ser-thu:#008300; --ser-chi:#e34948;
  --cat-0:#2a78d6; --cat-1:#eb6834; --cat-2:#1baf7a; --cat-3:#c98500; --cat-4:#e87ba4; --cat-5:#4a3aa7; --cat-khac:#8b8a80;
  --seq-1:#dbe9fc; --seq-2:#a9c9f6; --seq-3:#6da7ec; --seq-4:#2a78d6; --seq-5:#164a86;
  --shadow:0 1px 2px rgba(24,21,15,.06), 0 6px 16px -8px rgba(24,21,15,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181a; --surface:#1b2325; --surface-2:#212a2c; --line:#2c3739;
    --ink:#eef2ee; --ink-2:#b7c2bd; --muted:#84928c;
    --accent:#3fbfa0; --accent-strong:#5fd1b6; --accent-soft:rgba(63,191,160,.16); --accent-ink:#08211c;
    --gold:#e0b45a; --gold-soft:rgba(224,180,90,.16);
    --pos:#37c25f; --pos-soft:rgba(55,194,95,.16);
    --neg:#ff8a73; --neg-soft:rgba(255,138,115,.14);
    --st-good:#0ca30c; --st-good-soft:rgba(12,163,12,.2);
    --st-warn:#fab219; --st-warn-soft:rgba(250,178,25,.2);
    --st-crit:#e66767; --st-crit-soft:rgba(230,103,103,.2);
    --ser-thu:#3fae3f; --ser-chi:#e66767;
    --cat-0:#3987e5; --cat-1:#d95926; --cat-2:#199e70; --cat-3:#c98500; --cat-4:#d55181; --cat-5:#9085e9; --cat-khac:#84928c;
    --seq-1:#1c2c3d; --seq-2:#22436c; --seq-3:#2a5c96; --seq-4:#3987e5; --seq-5:#8fc0f7;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181a; --surface:#1b2325; --surface-2:#212a2c; --line:#2c3739;
  --ink:#eef2ee; --ink-2:#b7c2bd; --muted:#84928c;
  --accent:#3fbfa0; --accent-strong:#5fd1b6; --accent-soft:rgba(63,191,160,.16); --accent-ink:#08211c;
  --gold:#e0b45a; --gold-soft:rgba(224,180,90,.16);
  --pos:#37c25f; --pos-soft:rgba(55,194,95,.16);
  --neg:#ff8a73; --neg-soft:rgba(255,138,115,.14);
  --st-good:#0ca30c; --st-good-soft:rgba(12,163,12,.2);
  --st-warn:#fab219; --st-warn-soft:rgba(250,178,25,.2);
  --st-crit:#e66767; --st-crit-soft:rgba(230,103,103,.2);
  --ser-thu:#3fae3f; --ser-chi:#e66767;
  --cat-0:#3987e5; --cat-1:#d95926; --cat-2:#199e70; --cat-3:#c98500; --cat-4:#d55181; --cat-5:#9085e9; --cat-khac:#84928c;
  --seq-1:#1c2c3d; --seq-2:#22436c; --seq-3:#2a5c96; --seq-4:#3987e5; --seq-5:#8fc0f7;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
.mono{font-variant-numeric:tabular-nums;}
.disp{font-family:"Fraunces",Georgia,serif;}
#app{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:18px 64px;}
h1,h2,h3{margin:0; text-wrap:balance;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}

/* ---------- header ---------- */
.topbar{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand h1{font-size:26px; font-weight:600; letter-spacing:.2px;}
.brand .tag{font-size:12px; color:var(--muted); border-left:1px solid var(--line); padding-left:10px;}
.brand .tag:empty{display:none;}
.account{display:flex; align-items:center;}
.account-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:8px 16px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow);}
.account-btn:hover{border-color:var(--accent);}
.account-chip{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 14px 5px 5px; box-shadow:var(--shadow);}
.account-chip .avatar{width:24px; height:24px; border-radius:50%; object-fit:cover; display:block;}
.account-chip .name{font-size:13px; font-weight:600; color:var(--ink); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rule{height:2px; background:linear-gradient(90deg,var(--accent),transparent 75%); margin-block:12px 16px; border-radius:2px;}

.tabs{display:flex; width:fit-content; max-width:100%; overflow-x:auto; margin-bottom:20px; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:999px; background:var(--surface); box-shadow:var(--shadow); padding:3px;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto; position:relative; border:none; background:transparent; color:var(--ink-2); font-size:13.5px; font-weight:600; padding:8px 16px; border-radius:999px; transition:background .15s,color .15s;}
.tab-btn::before{content:""; position:absolute; left:0; top:22%; bottom:22%; width:1px; background:var(--line);}
.tab-btn:first-child::before{display:none;}
.tab-btn:hover{color:var(--ink);}
.tab-btn[aria-selected="true"]{background:var(--accent); color:var(--accent-ink);}
.tab-btn[aria-selected="true"]::before, .tab-btn[aria-selected="true"] + .tab-btn::before{display:none;}
.tab-btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* ---------- cards / layout ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow);}
.grid{display:grid; gap:10px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1.3fr 1fr;}
.g-2b{grid-template-columns:1fr 1fr;}
@media (max-width:860px){ .g-kpi{grid-template-columns:repeat(2,1fr);} .g-2,.g-2b{grid-template-columns:1fr;} }
.section-title{font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.section-title .hint{font-size:12px; font-weight:400; color:var(--muted);}
.stack{display:flex; flex-direction:column; gap:10px;}
.card > .stack{gap:14px;}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.spacer{flex:1;}

/* ---------- period picker ---------- */
.period{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:6px 8px;}
.period label{font-size:12px; color:var(--muted); font-weight:600;}
.period select{border:none; background:transparent; color:var(--ink); font-weight:600; font-size:13.5px; padding:4px 2px;}

/* ---------- KPI tiles ---------- */
.kpi{padding:16px; border-radius:14px; border:1px solid var(--line); background:var(--surface); position:relative; min-width:0;}
.kpi::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; border-radius:14px 14px 0 0; background:var(--bar,var(--accent));}
.kpi .lbl{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
.kpi .val{font-size:23px; font-weight:600; margin-top:8px; color:var(--fg,var(--ink)); white-space:nowrap; font-variant-numeric:tabular-nums;}
.kpi .sub{font-size:12px; color:var(--ink-2); margin-top:6px;}
.kpi.thu{--bar:var(--pos); --fg:var(--pos);}
.kpi.chi{--bar:var(--neg); --fg:var(--neg);}
.kpi.net{--bar:var(--accent); --fg:var(--accent-strong);}
.kpi.rate{--bar:var(--gold); --fg:var(--gold);}

/* ---------- year summary band ---------- */
.year-band{border:1.5px solid var(--accent); background:linear-gradient(135deg, var(--accent-soft), var(--surface) 45%);}
.year-band .section-title{color:var(--accent-strong);}
.year-content{display:grid; grid-template-columns:2fr 3fr; gap:22px; align-items:center; margin-top:16px;}
.year-content > *{min-width:0;}
.year-hero{border-right:1px solid var(--line); padding-right:22px;}
.year-hero .lbl{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2);}
.year-hero .val{font-size:34px; font-weight:600; margin-top:6px; color:var(--accent-strong); white-space:nowrap; font-variant-numeric:tabular-nums;}
.year-hero .sub{font-size:12px; color:var(--muted); margin-top:4px;}
.year-kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.subhead{font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
@media (max-width:760px){ .year-content{grid-template-columns:1fr;} .year-hero{border-right:none; border-bottom:1px solid var(--line); padding-right:0; padding-bottom:16px; margin-bottom:2px;} }
@media (max-width:760px){ .year-hero .val{font-size:min(34px,8vw);} }
@media (max-width:600px){ .year-kpis{gap:8px;} .year-kpis .kpi{padding:10px;} .year-kpis .kpi .val{font-size:clamp(11px,3.8vw,23px); overflow:hidden; text-overflow:ellipsis;} .year-kpis .kpi .lbl{font-size:10px;} .year-kpis .kpi .sub{font-size:10.5px;} }

/* ---------- pills ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px 4px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink);}
.pill .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.pill--good .dot{background:var(--st-good);} .pill--good{background:var(--st-good-soft);}
.pill--warn .dot{background:var(--st-warn);} .pill--warn{background:var(--st-warn-soft);}
.pill--crit .dot{background:var(--st-crit);} .pill--crit{background:var(--st-crit-soft);}
.pill--thu{background:var(--pos-soft); color:var(--pos);}
.pill--chi{background:var(--neg-soft); color:var(--neg);}

/* ---------- budget bars ---------- */
.budget-row{display:grid; grid-template-columns:130px 1fr auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
.budget-row:last-child{border-bottom:none;}
.budget-row .name{font-size:13px; font-weight:600;}
.budget-row .figs{font-size:11.5px; color:var(--muted);}
.track{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; position:relative;}
.track > i{display:block; height:100%; border-radius:99px; background:var(--accent);}
.track.over > i{background:var(--st-crit);}
.track.warn > i{background:var(--st-warn);}
@media (max-width:640px){ .budget-row{grid-template-columns:1fr; gap:4px;} }

/* ---------- donut ---------- */
.donut-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.donut{width:172px; height:172px; border-radius:50%; flex:0 0 auto; position:relative;}
.donut .hole{position:absolute; inset:24px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.donut .hole .n{font-size:17px; font-weight:600;}
.donut .hole .l{font-size:10px; color:var(--muted); margin-top:2px;}
.legend{display:flex; flex-direction:column; gap:8px; flex:1; min-width:180px;}
.legend .li{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.legend .sw{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
.legend .li .nm{flex:1; color:var(--ink-2);}
.legend .li .pct{font-weight:600; width:38px; text-align:right;}

/* ---------- bar chart ---------- */
.chart-svg{width:100%; height:auto; display:block;}
.chart-svg text{font-size:12.5px; fill:var(--muted);}
.chart-legend{display:flex; gap:16px; font-size:12.5px; color:var(--ink-2); margin-top:8px;}
.chart-legend .li{display:flex; align-items:center; gap:6px;}
.chart-legend .sw{width:10px; height:10px; border-radius:3px;}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; overflow-y:auto; max-height:460px; scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
.tbl-wrap::-webkit-scrollbar{height:8px; width:8px;}
.tbl-wrap::-webkit-scrollbar-track{background:transparent;}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.tbl-wrap::-webkit-scrollbar-thumb:hover{background:var(--muted);}
.tbl-wrap thead th{position:sticky; top:0; background:var(--surface); z-index:1;}
table{border-collapse:collapse; width:100%; font-size:12.5px;}
th{text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
th:first-child, td:first-child{text-align:left;}
td{text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.total td{font-weight:700; background:var(--surface-2);}
.mm-cell{text-align:center; font-size:11px; border-radius:4px;}

/* ---------- form ---------- */
.entry-card{border:1.5px solid var(--accent); position:relative; padding:15px;}
.entry-card .section-title{color:var(--accent-strong); margin-bottom:10px;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11px; font-weight:700; color:var(--ink-2);}
.field input, .field select, .field textarea{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9px; padding:7px 10px; font-size:13.5px; width:100%;}
.field textarea{resize:vertical; min-height:38px; font-family:inherit;}
.entry-card .stack{gap:10px;}
.form-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:9px;}
.form-grid .span2{grid-column:span 2;}
.form-grid .span4{grid-column:span 4;}
.form-grid .span6{grid-column:span 6;}
@media (max-width:760px){ .form-grid{grid-template-columns:repeat(4,1fr);} .form-grid .span2{grid-column:span 2;} .form-grid .span4,.form-grid .span6{grid-column:span 4;} }
@media (max-width:340px){ .form-grid{grid-template-columns:repeat(2,1fr);} .form-grid .span2,.form-grid .span4,.form-grid .span6{grid-column:span 2;} }

.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.seg button{flex:1; border:none; background:var(--bg); color:var(--ink-2); font-weight:700; font-size:13px; padding:9px 10px;}
.seg button[aria-pressed="true"].thu{background:var(--pos-soft); color:var(--pos);}
.seg button[aria-pressed="true"].chi{background:var(--neg-soft); color:var(--neg);}

.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:10px 16px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
.data-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.data-actions .btn{flex:1 1 150px;}
@media (max-width:480px){ .data-actions{flex-direction:column;} .data-actions .btn{flex:1 1 auto;} }
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:10px 12px;}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:7px;}
.btn-danger{color:var(--neg);}
.amount-preview{font-size:11.5px; color:var(--muted); margin-top:2px;}

/* ---------- tx list ---------- */
.tx-row td{vertical-align:middle;}
.tx-actions{display:flex; gap:6px; justify-content:flex-end;}
.tx-desc{max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left !important;}
.sample-badge{font-size:9.5px; font-weight:700; color:var(--gold); background:var(--gold-soft); padding:1px 6px; border-radius:5px; margin-left:6px;}

/* ---------- settings ---------- */
.cat-row{display:grid; grid-template-columns:1fr 130px 34px; gap:8px; align-items:center; margin-bottom:8px;}
.cat-row input{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:13px;}
.icon-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink-2); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px;}
.icon-btn:hover{border-color:var(--neg); color:var(--neg);}
.settings-note{font-size:12px; color:var(--muted); line-height:1.5;}

/* ---------- misc ---------- */
.empty{padding:30px 12px; text-align:center; color:var(--muted); font-size:13px;}
.banner{border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:14px 16px; font-size:13px; color:var(--ink-2); display:flex; gap:10px; align-items:flex-start;}
.banner.warn{border-color:var(--st-warn); background:var(--st-warn-soft);}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 18px; border-radius:99px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:50;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.footnote{font-size:11.5px; color:var(--muted); margin-top:18px; text-align:center;}
.lock-card{max-width:420px; margin:56px auto; text-align:center; padding:38px 28px;}
.lock-card .lock-icon{font-size:32px; margin-bottom:14px;}
.lock-card h2{font-size:19px; font-weight:600; margin-bottom:8px;}
.lock-card p{font-size:13.5px; color:var(--ink-2); line-height:1.55; margin-bottom:22px;}
[data-view]{display:none;}
[data-view].active{display:flex;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
</style>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1 class="disp">Sổ Thu Chi</h1>
      <span class="tag" id="periodTag">—</span>
    </div>
    <div class="account" id="accountSlot"></div>
  </div>
  <div class="rule"></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Điều hướng">
    <button class="tab-btn" data-tab="dashboard" role="tab" aria-selected="true">Tổng quan</button>
    <button class="tab-btn" data-tab="entry" role="tab" aria-selected="false">Nhập liệu</button>
    <button class="tab-btn" data-tab="monthly" role="tab" aria-selected="false">Theo tháng</button>
    <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false">Cài đặt</button>
  </nav>

  <div id="banner-slot"></div>

  <section data-view="dashboard" class="stack"></section>
  <section data-view="entry" class="stack"></section>
  <section data-view="monthly" class="stack"></section>
  <section data-view="settings" class="stack"></section>

  <p class="footnote" id="footnote"></p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= utilities ================= */
function pad2(n){return String(n).padStart(2,"0");}
function todayISO(){const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function fmtMoney(n){ n = Number(n)||0; const neg = n<0; const s = Math.round(Math.abs(n)).toLocaleString("vi-VN"); return (neg?"-":"")+s; }
function fmtPct(n){ return Math.round((Number(n)||0)*100)+"%"; }
/** Thousand/million separators for editable amount fields (not used for years). */
function fmtInt(n){ n = Math.round(Number(n)||0); return n.toLocaleString("vi-VN"); }
function parseIntInput(v){ const s = String(v==null?"":v).replace(/[^\d-]/g,""); return s ? (Number(s)||0) : 0; }
/** Wires a text input to auto-format with "." thousand separators as the user types, keeping the cursor stable. */
function attachThousandsInput(el){
  if (!el || el.dataset.thousandsWired) return;
  el.dataset.thousandsWired = "1";
  el.addEventListener("input", ()=>{

/* ================= real storage for the standalone (Netlify) version =================
   Backed by a Netlify Function + Netlify Blobs (see netlify/functions/data.mjs), so data
   survives page reloads and new deploys. Every request carries the visitor's Auth0 access
   token; the function rejects anything it can't verify, so signed-out visitors get nothing. */
function netlifyDb(){
  const ENDPOINT = "/.netlify/functions/data";
  const cache = { settings: null, tx: {} };
  const settingsSubs = new Set();
  const txSubs = new Set();
  let saveTimer = null;

  async function authHeaders(extra){
    const token = await auth0Client.getTokenSilently();
    return Object.assign({ "Authorization": "Bearer " + token }, extra||{});
  }
  function fireSettings(){ settingsSubs.forEach(fn=>fn({exists:!!cache.settings, data:()=>cache.settings})); }
  function fireTx(){
    const arr = Object.keys(cache.tx).map(id=>({id,data:cache.tx[id]})).sort((a,b)=> b.data.date.localeCompare(a.data.date));
    txSubs.forEach(fn=>fn({docs:arr.map(x=>({id:x.id, exists:true, data:()=>x.data}))}));
  }
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        const headers = await authHeaders({ "Content-Type":"application/json" });
        const res = await fetch(ENDPOINT, { method:"PUT", headers, body: JSON.stringify({ settings: cache.settings, tx: cache.tx }) });
        if (!res.ok) throw new Error("save_failed");
      }catch(e){ toast("Không lưu được lên máy chủ, thử lại sau."); }
    }, 250);
  }
  const ready = (async ()=>{
    const headers = await authHeaders();
    const res = await fetch(ENDPOINT, { headers });
    if (!res.ok) throw new Error("load_failed");
    const data = await res.json();
    cache.settings = (data && data.settings) || null;
    cache.tx = (data && data.tx) || {};
  })();

  return {
    doc(path){
      return {
        get(){ return ready.then(()=>({exists:!!cache.settings, data:()=>cache.settings})); },
        set(data){ cache.settings = Object.assign({}, data); fireSettings(); persist(); return Promise.resolve(); },
        onSnapshot(next, errFn){
          settingsSubs.add(next);
          ready.then(()=> next({exists:!!cache.settings, data:()=>cache.settings})).catch(err=>{ if(errFn) errFn(err); });
          return ()=>settingsSubs.delete(next);
        }
      };
    },
    collection(path){
      return {
        orderBy(){ return this; }, limit(){ return this; }, where(){ return this; },
        add(data){ const id=uid(); cache.tx[id]=data; fireTx(); persist(); return Promise.resolve({id}); },
        doc(id){ return {
          update(data){ cache.tx[id]=Object.assign({},cache.tx[id],data); fireTx(); persist(); return Promise.resolve(); },
          delete(){ delete cache.tx[id]; fireTx(); persist(); return Promise.resolve(); }
        }; },
        onSnapshot(next, errFn){
          txSubs.add(next);
          ready.then(()=> fireTx()).catch(err=>{ if(errFn) errFn(err); });
          return ()=>txSubs.delete(next);
        }
      };
    }
  };
}

function attachDbSubscriptions(db){
  if (!db){ S.dbUnavailable = true; renderBanner(); renderAll(); return; }
  S.db = db;
  let seeding = false;
  const settingsRef = db.doc("app/settings");
  function subscribeSettings(){
    settingsRef.onSnapshot(async (snap)=>{
      S.settingsError = false;
      if (!snap.exists){
        S.settings = defaultSettings();
        if (!seeding){
          seeding = true;
          try{
            await settingsRef.set(S.settings);
            const sample = buildSampleTx(S.settings);
            await Promise.all(sample.map(t => db.collection("transactions").add(t)));
          }catch(e){}
        }
      } else {
        S.settings = snap.data();
      }
      S.ready = true;
      renderBanner();
      renderAll();
    }, ()=>{ S.settingsError = true; renderBanner(); setTimeout(subscribeSettings, 4000); });
  }
  function subscribeTx(){
    db.collection("transactions").orderBy("date","desc").limit(1000).onSnapshot((qs)=>{
      S.tx = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
      S.txError = false;
      renderBanner();
      renderAll();
    }, ()=>{ S.txError = true; renderBanner(); setTimeout(subscribeTx, 4000); });
  }
  subscribeSettings();
  subscribeTx();
}

let netlifyDbStarted = false;
function startNetlifyDb(){
  if (netlifyDbStarted) return;
  netlifyDbStarted = true;
  attachDbSubscriptions(netlifyDb());
}

async function boot(){
  renderAccount();
  if (typeof window.claude === "undefined"){

    return;

  let db;
  try { db = await window.claude.use("db"); } catch(e){ db = null; }
  // Acquire "downloads" and "user" independently — never let a slow/unsupported capability block the rest of the app.
  Promise.resolve(window.claude.use("downloads")).then(d=>{
    S.downloads = d || null;
    if (S.tab==="settings" && S.ready) renderSettingsView();

    const me = await u.me();
    S.user = me;
    renderAccount();
  }).catch(()=>{});
  attachDbSubscriptions(db);
}

function monthTotals(y,m){
  let thu=0, chi=0;
  S.tx.forEach(t=>{ const {y:ty,m:tm}=ymOf(t.date); if(ty===y&&tm===m){ if(t.type==="thu") thu+=Number(t.amount)||0; else chi+=Number(t.amount)||0; } });
  return {thu,chi,net:thu-chi};
}
function yearMonthsSeries(y){
  const rows=[]; let cum = Number((S.settings&&S.settings.openingBalance)||0);
  for(let m=1;m<=12;m++){ const {thu,chi,net}=monthTotals(y,m); cum+=net; rows.push({m,thu,chi,net,cum}); }
  return rows;
}
function categorySpend(y,m){
  const cats = (S.settings.expenseCats||[]);
  return cats.map(c=>{
    let spent=0; S.tx.forEach(t=>{ if(t.type==="chi"&&t.category===c.name){ const {y:ty,m:tm}=ymOf(t.date); if(ty===y&&tm===m) spent+=Number(t.amount)||0; } });
    return {name:c.name, budget:Number(c.budget)||0, spent};
  });
}
function statusOf(spent,budget){
  if (budget<=0) return spent>0 ? "crit" : "good";
  const r = spent/budget;
  if (r>1) return "crit";
  if (r>=(S.settings.alertPct||0.8)) return "warn";
  return "good";
}
function availableYears(){
  const set = new Set(S.tx.map(t=>ymOf(t.date).y));
  if (S.settings) set.add(S.settings.year||new Date().getFullYear());
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a,b)=>a-b);
}

function donutHtml(slices, total){
  const colorVar = i => i<0 ? "var(--cat-khac)" : "var(--cat-"+i+")";
  let acc=0; const stops=[];
  slices.forEach((s,i)=>{
    const p0 = total? acc/total*100:0;
    acc += s.val;
    const p1 = total? acc/total*100:0;
    const cvar = s.cls==="cat-khac" ? "var(--cat-khac)" : "var("+"--"+s.cls+")";
    stops.push(cvar+" "+p0.toFixed(2)+"% "+p1.toFixed(2)+"%");
  });
  const grad = "conic-gradient("+stops.join(",")+")";
  const legend = slices.map(s=>{
    const cvar = s.cls==="cat-khac" ? "var(--cat-khac)" : "var(--"+s.cls+")";
    return '<div class="li"><i class="sw" style="background:'+cvar+'"></i><span class="nm">'+esc(s.name)+'</span><span class="pct mono">'+(total? Math.round(s.val/total*100):0)+'%</span></div>';
  }).join("");
  return '<div class="donut-wrap"><div class="donut" style="background:'+grad+'"><div class="hole"><div class="n mono">'+fmtMoney(total)+'</div><div class="l">tổng chi</div></div></div><div class="legend">'+legend+'</div></div>';
}

function groupedBarSvg(rows, labelA, labelB, colorA, colorB){
  const W=640,H=238, padL=54,padR=10,padT=16,padB=28;
  const max = Math.max(1, ...rows.map(r=>Math.max(r.a,r.b)));
  const niceMax = niceCeil(max);
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const groupW = plotW/rows.length;
  const barW = Math.min(16, groupW/2 - 6);
  const y0 = padT+plotH;
  const gridN = 4;
  let grid = "";
  for(let i=0;i<=gridN;i++){
    const yy = padT + plotH - (plotH*i/gridN);
    const val = niceMax*i/gridN;
    grid += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    grid += '<text x="'+(padL-6)+'" y="'+(yy+3)+'" text-anchor="end">'+shortNum(val)+'</text>';
  }
  let bars = "";
  rows.forEach((r,i)=>{
    const gx = padL + i*groupW;
    const ha = plotH*(r.a/niceMax), hb = plotH*(r.b/niceMax);
    const xa = gx + groupW/2 - barW - 2, xb = gx + groupW/2 + 2;
    bars += '<rect x="'+xa+'" y="'+(y0-ha)+'" width="'+barW+'" height="'+Math.max(0,ha)+'" rx="2" fill="'+colorA+'"><title>'+labelA+' '+r.label+': '+fmtMoney(r.a)+'</title></rect>';
    bars += '<rect x="'+xb+'" y="'+(y0-hb)+'" width="'+barW+'" height="'+Math.max(0,hb)+'" rx="2" fill="'+colorB+'"><title>'+labelB+' '+r.label+': '+fmtMoney(r.b)+'</title></rect>';
    bars += '<text x="'+(gx+groupW/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ thu chi theo tháng">'+grid+bars+'</svg>';
}
function niceCeil(v){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))); const n=v/p; const f = n<=1?1:n<=2?2:n<=5?5:10; return f*p; }
function shortNum(v){ if(v>=1e9) return (v/1e9).toFixed(v%1e9?1:0)+"tỷ"; if(v>=1e6) return (v/1e6).toFixed(v%1e6?1:0)+"tr"; if(v>=1e3) return (v/1e3).toFixed(0)+"k"; return String(Math.round(v)); }

function periodPickerHtml(prefix){

}

  rows = rows.slice(0,200);
  if (!rows.length){ wrap.innerHTML = '<div class="empty">Không có giao dịch nào khớp.</div>'; return; }
  const trs = rows.map(t=>{
    const [yy,mm,dd] = t.date.split("-");

    const sign = t.type==="thu"?"+":"-";

        '<button class="btn btn-sm" data-act="edit" data-id="'+t.id+'">Sửa</button>'+

    };
  });

  const cats = (S.settings.expenseCats||[]).map(c=>{
    const vals = rows.map(r=>{ let s=0; S.tx.forEach(t=>{ if(t.type==="chi"&&t.category===c.name){ const p=ymOf(t.date); if(p.y===y&&p.m===r.m) s+=Number(t.amount)||0; } }); return s; });
    return {name:c.name, vals, total: vals.reduce((a,b)=>a+b,0)};

  const maxCell = Math.max(1, ...cats.flatMap(c=>c.vals));

  const matrixHead = '<tr><th style="text-align:left">Danh mục</th>'+rows.map(r=>'<th>T'+r.m+'</th>').join("")+'<th>Cả năm</th></tr>';

    const cells = c.vals.map(v=>{ const b=bucket(v); return '<td class="mm-cell'+(b?' seq-'+b:'')+'"'+(b?' style="background:var(--seq-'+b+')"':'')+'>'+(v?shortNum(v):"–")+'</td>'; }).join("");
    return '<tr><td style="text-align:left">'+esc(c.name)+'</td>'+cells+'<td class="mono">'+fmtMoney(c.total)+'</td></tr>';
  }).join("");

  root.innerHTML =

      '<div class="period"><label>Năm</label><select id="monthlyYear">'+years.map(yy=>'<option value="'+yy+'"'+(yy===y?" selected":"")+'>'+yy+'</option>').join("")+'</select></div>'+

    '<div class="card"><div class="section-title">Thu – chi theo tháng</div>'+barSvg+'<div class="chart-legend"><span class="li"><i class="sw" style="background:var(--ser-thu)"></i>Thu</span><span class="li"><i class="sw" style="background:var(--ser-chi)"></i>Chi</span></div></div>'+
    '<div class="card"><div class="section-title">Chi tiêu theo danh mục × tháng<span class="hint">Đậm màu = chi nhiều hơn</span></div>'+
      (cats.length? '<div class="tbl-wrap"><table><thead>'+matrixHead+'</thead><tbody>'+matrixRows+'</tbody></table></div>' : '<div class="empty">Chưa có dữ liệu chi tiêu trong năm này.</div>')+
    '</div>';

  document.getElementById("monthlyYear").onchange = (e)=>{ S.dashY = Number(e.target.value); renderMonthly(); };
}

/* ---------- import / export ---------- */
const CSV_COLS = ["date","type","category","amount","desc","method","note"];
function csvEscape(v){
  const s = v==null ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvSectionLines(name, header, dataRows){
  const lines = ["#"+name];
  if (header) lines.push(header.map(csvEscape).join(","));
  dataRows.forEach(r=> lines.push(r.map(csvEscape).join(",")));
  return lines;
}
/** Export file bundles the current settings (chung 1 file) plus the transaction list, in labelled CSV sections. */
function buildExportCsv(settings, rows){
  const s = settings || {};
  const lines = [];
  lines.push(...csvSectionLines("SETTINGS", ["year","openingBalance","savingsGoalPct","alertPct"], [[
    s.year||"", s.openingBalance||0, Math.round((s.savingsGoalPct||0)*100), Math.round((s.alertPct||0)*100)
  ]]));
  lines.push(...csvSectionLines("EXPENSE_CATS", ["name","budget"], (s.expenseCats||[]).map(c=>[c.name, c.budget])));
  lines.push(...csvSectionLines("INCOME_CATS", ["name"], (s.incomeCats||[]).map(c=>[c])));
  lines.push(...csvSectionLines("METHODS", ["name"], (s.methods||[]).map(c=>[c])));
  lines.push(...csvSectionLines("TRANSACTIONS", CSV_COLS, rows.map(t=>CSV_COLS.map(k=> k==="type" ? (t.type==="thu"?"thu":"chi") : t[k]))));
  return "﻿"+lines.join("\r\n");
}
async function doExport(){
  if (!S.tx.length){ toast("Chưa có giao dịch nào để xuất."); return; }
  const rows = S.tx.slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  const csv = buildExportCsv(S.settings, rows);
  const stamp = todayISO();
  const filename = "so-thu-chi-"+stamp+".csv";

  if (typeof window.claude === "undefined"){
    // Standalone (Netlify): there's no "downloads" capability here — trigger a normal browser download instead.
    try{
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      toast("Đã xuất "+rows.length+" giao dịch kèm cài đặt ra file CSV.");
    }catch(err){ toast("Không xuất được file, thử lại nhé."); }
    return;
  }

  if (!S.downloads){ toast("Tính năng xuất file không khả dụng ở đây."); return; }
  try{
    const res = await S.downloads.save({ filename, data: csv });
    if (res.status==="saved") toast("Đã xuất "+rows.length+" giao dịch kèm cài đặt ra file CSV.");
  }catch(err){
    const code = err && err.code;
    if (code==="declined") return;
    if (code==="rate_limited") toast("Đang có một yêu cầu lưu file khác, thử lại sau vài giây.");
    else toast("Không xuất được file, thử lại nhé.");
  }
}
/** Minimal RFC4180-ish CSV parser: handles quoted fields, escaped quotes, commas/newlines inside quotes. */
function parseCsv(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip, \n handles the break */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}
/** Splits a parsed CSV table into named sections using "#SECTION_NAME" marker rows.
 *  Files exported before this feature have no markers — everything before the first marker
 *  (i.e. the whole file) is collected under __LEGACY__ so old exports still import fine. */
function splitCsvSections(table){
  const sections = {}; let cur = null;
  table.forEach(row=>{
    if (row.length===1 && /^#[A-Z_]+$/.test(String(row[0]||"").trim())){
      cur = String(row[0]).trim().slice(1);
      sections[cur] = [];
    } else if (cur){
      sections[cur].push(row);
    } else {
      (sections.__LEGACY__ = sections.__LEGACY__ || []).push(row);
    }
  });
  return sections;
}
function parseImportedSettings(sections){
  if (!sections.SETTINGS || sections.SETTINGS.length<2) return null;
  const header = sections.SETTINGS[0].map(h=>String(h).trim());
  const row = sections.SETTINGS[1];
  const val = k=> row[header.indexOf(k)];
  const settings = {
    year: Number(val("year"))||new Date().getFullYear(),
    openingBalance: Number(val("openingBalance"))||0,
    savingsGoalPct: Math.max(0,Math.min(100,Number(val("savingsGoalPct"))||0))/100,
    alertPct: Math.max(0,Math.min(100,Number(val("alertPct"))||0))/100,
    expenseCats: [], incomeCats: [], methods: [], seeded: true
  };
  if (sections.EXPENSE_CATS && sections.EXPENSE_CATS.length>1){
    const h = sections.EXPENSE_CATS[0].map(x=>String(x).trim());
    const ni=h.indexOf("name"), bi=h.indexOf("budget");
    settings.expenseCats = sections.EXPENSE_CATS.slice(1)
      .filter(r=>r.some(c=>String(c).trim()!==""))
      .map(r=>({name:String(r[ni]||"").trim(), budget:Number(r[bi])||0}))
      .filter(c=>c.name);
  }
  if (sections.INCOME_CATS && sections.INCOME_CATS.length>1){
    const h = sections.INCOME_CATS[0].map(x=>String(x).trim());
    const ni=h.indexOf("name");
    settings.incomeCats = sections.INCOME_CATS.slice(1).map(r=>String(r[ni]||"").trim()).filter(Boolean);
  }
  if (sections.METHODS && sections.METHODS.length>1){
    const h = sections.METHODS[0].map(x=>String(x).trim());
    const ni=h.indexOf("name");
    settings.methods = sections.METHODS.slice(1).map(r=>String(r[ni]||"").trim()).filter(Boolean);
  }
  return settings;
}
function normType(v){
  const s = String(v||"").trim().toLowerCase();
  if (["thu","in","income","thu nhập","revenue","+"].includes(s) || s.startsWith("thu")) return "thu";
  if (["chi","out","expense","chi tiêu","-"].includes(s) || s.startsWith("chi")) return "chi";
  return null;
}
function normDate(v){
  const s = String(v||"").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return s;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m){ const [,d,mo,y]=m; return y+"-"+pad2(Number(mo))+"-"+pad2(Number(d)); }
  return null;
}
function normAmount(v){
  const s = String(v==null?"":v).trim();
  if (!s) return NaN;
  const digits = s.replace(/[^\d]/g,"");
  if (!digits) return NaN;
  return Number(digits);
}
function handleImportFile(file){
  if (!file) return;
  if (S.dbUnavailable || !S.db){ toast("Chưa kết nối được bộ nhớ, không thể nhập."); return; }
  if (S.importing) return;
  const reader = new FileReader();
  reader.onerror = ()=> toast("Không đọc được file.");
  reader.onload = async ()=>{
    const text = String(reader.result||"");
    const table = parseCsv(text);
    if (!table.length){ toast("File CSV trống hoặc không đọc được."); return; }
    const sections = splitCsvSections(table);
    const txTable = sections.TRANSACTIONS || sections.__LEGACY__;
    const importedSettings = parseImportedSettings(sections);
    if (!txTable || !txTable.length){
      if (!importedSettings){ toast("File CSV không có dữ liệu để nhập."); return; }
    }
    let valid = [], bad = 0;
    if (txTable && txTable.length){
      const header = txTable[0].map(h=>h.trim().toLowerCase());
      const idx = { date:header.indexOf("date"), type:header.indexOf("type"), category:header.indexOf("category"), amount:header.indexOf("amount"), desc:header.indexOf("desc"), method:header.indexOf("method"), note:header.indexOf("note") };
      if (idx.date<0 || idx.type<0 || idx.category<0 || idx.amount<0){
        if (!importedSettings){ toast("File CSV cần có các cột: date, type, category, amount."); return; }
      } else {
        const dataRows = txTable.slice(1);
        dataRows.forEach(r=>{
          if (!r.some(c=>String(c).trim()!=="")) return;
          const date = normDate(idx.date>=0? r[idx.date]:"");
          const type = normType(idx.type>=0? r[idx.type]:"");
          const category = (idx.category>=0? r[idx.category]:"").trim();
          const amount = normAmount(idx.amount>=0? r[idx.amount]:"");
          if (!date || !type || !category || !amount || amount<=0){ bad++; return; }
          valid.push({
            date, type, category, amount,
            desc: idx.desc>=0 ? (r[idx.desc]||"").trim() : "",
            method: idx.method>=0 ? (r[idx.method]||"").trim() : "",
            note: idx.note>=0 ? (r[idx.note]||"").trim() : "",
            createdAt: new Date().toISOString()
          });
        });
      }
    }
    if (!valid.length && !importedSettings){ toast("Không có dòng hợp lệ nào trong file để nhập."); return; }
    S.importing = true;
    renderSettingsView();
    try{
      const parts = [];
      if (importedSettings){
        try{ await S.db.doc("app/settings").set(importedSettings); parts.push("cài đặt"); }catch(e){}
      }
      let ok = 0;
      for (const t of valid){
        try{ await S.db.collection("transactions").add(t); ok++; }catch(e){}
      }
      if (ok) parts.push(ok+" giao dịch");
      const msg = parts.length ? ("Đã nhập "+parts.join(" và ")+(bad?(", bỏ qua "+bad+" dòng không hợp lệ"):"")+".") : "Không có gì để nhập.";
      toast(msg);
    } finally {
      S.importing = false;
      renderSettingsView();
    }
  };
  reader.readAsText(file, "utf-8");
}

/* ---------- settings ---------- */
function renderSettingsView(){
  const root = document.querySelector('[data-view="settings"]');
  const s = S.settings;
  const expRows = (s.expenseCats||[]).map((c,i)=>
    '<div class="cat-row" data-i="'+i+'"><input type="text" class="exp-name" value="'+esc(c.name)+'"><input type="text" inputmode="numeric" class="exp-budget mono" value="'+fmtInt(c.budget)+'"><button type="button" class="icon-btn" data-remove="exp" data-i="'+i+'">✕</button></div>'
  ).join("");
  const incRows = (s.incomeCats||[]).map((c,i)=>
    '<div class="cat-row" style="grid-template-columns:1fr 34px;" data-i="'+i+'"><input type="text" class="inc-name" value="'+esc(c)+'"><button type="button" class="icon-btn" data-remove="inc" data-i="'+i+'">✕</button></div>'
  ).join("");
  const methRows = (s.methods||[]).map((c,i)=>
    '<div class="cat-row" style="grid-template-columns:1fr 34px;" data-i="'+i+'"><input type="text" class="meth-name" value="'+esc(c)+'"><button type="button" class="icon-btn" data-remove="meth" data-i="'+i+'">✕</button></div>'
  ).join("");
  const sampleCount = S.tx.filter(t=>t.sample).length;

  root.innerHTML =
    '<div class="grid g-2b">'+
      '<div class="card">'+
        '<div class="section-title">Thông số chung</div>'+
        '<div class="stack">'+
          '<div class="field"><label for="st-year">Năm theo dõi</label><input type="number" id="st-year" value="'+s.year+'"></div>'+
          '<div class="field"><label for="st-open">Số dư đầu kỳ (₫)</label><input type="text" inputmode="numeric" id="st-open" value="'+fmtInt(s.openingBalance)+'"></div>'+
          '<div class="field"><label for="st-goal">Mục tiêu tiết kiệm (%)</label><input type="number" id="st-goal" min="0" max="100" value="'+Math.round(s.savingsGoalPct*100)+'"></div>'+
          '<div class="field"><label for="st-alert">Ngưỡng cảnh báo ngân sách (%)</label><input type="number" id="st-alert" min="0" max="100" value="'+Math.round(s.alertPct*100)+'"></div>'+
        '</div>'+
      '</div>'+
      '<div class="card data-card">'+
        '<div class="section-title">Dữ liệu</div>'+
        '<div class="data-actions">'+
          '<button type="button" class="btn" id="exportCsv"'+((typeof window.claude==="undefined"||S.downloads)?"":" disabled")+'>Xuất file (.csv)</button>'+
          '<button type="button" class="btn" id="importCsvBtn"'+(S.importing?" disabled":"")+'>'+(S.importing?"Đang nhập…":"Nhập file (.csv)")+'</button>'+
          '<input type="file" id="importCsvInput" accept=".csv,text/csv" style="display:none">'+
          (sampleCount? '<button type="button" class="btn btn-danger" id="clearSample">Xóa dữ liệu mẫu</button>' : '')+
          (S.tx.length? '<button type="button" class="btn btn-danger" id="clearAll">'+(S.clearAllArm?"Xác nhận xóa toàn bộ?":"Xóa toàn bộ giao dịch")+'</button>' : '')+
          '<button type="button" class="btn btn-primary" id="saveSettings">Lưu cài đặt</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="grid g-2">'+
      '<div class="card">'+
        '<div class="section-title">Danh mục chi & ngân sách / tháng<span class="hint">Tổng: <span id="expTotal" class="mono"></span></span></div>'+
        '<div id="expList">'+expRows+'</div>'+
        '<button type="button" class="btn btn-sm" id="addExp">+ Thêm danh mục chi</button>'+
      '</div>'+
      '<div class="stack">'+
        '<div class="card">'+
          '<div class="section-title">Nguồn thu</div>'+
          '<div id="incList">'+incRows+'</div>'+
          '<button type="button" class="btn btn-sm" id="addInc">+ Thêm nguồn thu</button>'+
        '</div>'+
        '<div class="card">'+
          '<div class="section-title">Hình thức thanh toán</div>'+
          '<div id="methList">'+methRows+'</div>'+
          '<button type="button" class="btn btn-sm" id="addMeth">+ Thêm hình thức</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  attachThousandsInput(document.getElementById("st-open"));

  function computeExpTotal(){
    let t=0; root.querySelectorAll(".exp-budget").forEach(i=>t+=parseIntInput(i.value));
    document.getElementById("expTotal").textContent = fmtMoney(t);
  }
  computeExpTotal();
  root.querySelectorAll(".exp-budget").forEach(i=>{ attachThousandsInput(i); i.addEventListener("input", computeExpTotal); });

  root.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = ()=>{ b.closest(".cat-row").remove(); computeExpTotal(); };
  });
  document.getElementById("addExp").onclick = ()=>{
    const row = document.createElement("div"); row.className="cat-row";
    row.innerHTML = '<input type="text" class="exp-name" placeholder="Tên danh mục"><input type="text" inputmode="numeric" class="exp-budget mono" value="0"><button type="button" class="icon-btn" data-remove="exp">✕</button>';
    document.getElementById("expList").appendChild(row);
    row.querySelector("[data-remove]").onclick = ()=>{ row.remove(); computeExpTotal(); };
    attachThousandsInput(row.querySelector(".exp-budget"));
    row.querySelector(".exp-budget").addEventListener("input", computeExpTotal);
    row.querySelector(".exp-name").focus();
  };
  document.getElementById("addInc").onclick = ()=>{
    const row = document.createElement("div"); row.className="cat-row"; row.style.gridTemplateColumns="1fr 34px";
    row.innerHTML = '<input type="text" class="inc-name" placeholder="Tên nguồn thu"><button type="button" class="icon-btn" data-remove="inc">✕</button>';
    document.getElementById("incList").appendChild(row);
    row.querySelector("[data-remove]").onclick = ()=>row.remove();
    row.querySelector(".inc-name").focus();
  };
  document.getElementById("addMeth").onclick = ()=>{
    const row = document.createElement("div"); row.className="cat-row"; row.style.gridTemplateColumns="1fr 34px";
    row.innerHTML = '<input type="text" class="meth-name" placeholder="Tên hình thức"><button type="button" class="icon-btn" data-remove="meth">✕</button>';
    document.getElementById("methList").appendChild(row);
    row.querySelector("[data-remove]").onclick = ()=>row.remove();
    row.querySelector(".meth-name").focus();
  };

  const exportBtn = document.getElementById("exportCsv");
  if (exportBtn) exportBtn.onclick = doExport;
  const importBtn = document.getElementById("importCsvBtn");
  const importInput = document.getElementById("importCsvInput");
  if (importBtn && importInput){
    importBtn.onclick = ()=>{ if(!S.importing) importInput.click(); };
    importInput.onchange = ()=>{
      const file = importInput.files && importInput.files[0];
      importInput.value = "";
      if (file) handleImportFile(file);
    };
  }

  const clearBtn = document.getElementById("clearSample");
  if (clearBtn) clearBtn.onclick = async ()=>{
    if (S.dbUnavailable || !S.db) { toast("Chưa kết nối được bộ nhớ."); return; }
    const ids = S.tx.filter(t=>t.sample).map(t=>t.id);
    clearBtn.disabled = true; clearBtn.textContent = "Đang xóa…";
    try{ await Promise.all(ids.map(id=>S.db.collection("transactions").doc(id).delete())); toast("Đã xóa "+ids.length+" giao dịch mẫu."); }
    catch(e){ toast("Có lỗi khi xóa, thử lại."); }
  };

  const clearAllBtn = document.getElementById("clearAll");
  if (clearAllBtn) clearAllBtn.onclick = async ()=>{
    if (S.dbUnavailable || !S.db) { toast("Chưa kết nối được bộ nhớ."); return; }
    if (!S.clearAllArm){
      S.clearAllArm = true;
      renderSettingsView();
      setTimeout(()=>{ if (S.clearAllArm){ S.clearAllArm = false; renderSettingsView(); } }, 4000);
      return;
    }
    S.clearAllArm = false;
    const ids = S.tx.map(t=>t.id);
    clearAllBtn.disabled = true; clearAllBtn.textContent = "Đang xóa…";
    try{ await Promise.all(ids.map(id=>S.db.collection("transactions").doc(id).delete())); toast("Đã xóa toàn bộ "+ids.length+" giao dịch."); }
    catch(e){ toast("Có lỗi khi xóa, thử lại."); renderSettingsView(); }
  };

  document.getElementById("saveSettings").onclick = async ()=>{
    const expenseCats = Array.from(root.querySelectorAll(".exp-name")).map((el,i)=>({name:el.value.trim(), budget:parseIntInput(root.querySelectorAll(".exp-budget")[i].value)})).filter(c=>c.name);
    const incomeCats = Array.from(root.querySelectorAll(".inc-name")).map(el=>el.value.trim()).filter(Boolean);
    const methods = Array.from(root.querySelectorAll(".meth-name")).map(el=>el.value.trim()).filter(Boolean);
    const newSettings = {
      year: Number(document.getElementById("st-year").value)||new Date().getFullYear(),
      openingBalance: parseIntInput(document.getElementById("st-open").value),
      savingsGoalPct: Math.max(0,Math.min(100,Number(document.getElementById("st-goal").value)||0))/100,
      alertPct: Math.max(0,Math.min(100,Number(document.getElementById("st-alert").value)||0))/100,
      expenseCats, incomeCats, methods, seeded:true
    };
    if (S.dbUnavailable || !S.db){ toast("Chưa kết nối được bộ nhớ, không thể lưu."); return; }
    try{ await S.db.doc("app/settings").set(newSettings); toast("Đã lưu cài đặt."); }
    catch(e){ toast("Không lưu được, thử lại."); }
  };
}

document.getElementById("tabs").addEventListener("click",(e)=>{
  const b = e.target.closest(".tab-btn"); if(!b) return;
  S.tab = b.dataset.tab; S.editId=null; S.clearAllArm=false; renderTabs();
  if (S.settings){
    if (S.tab==="entry") renderEntry();
    if (S.tab==="monthly") renderMonthly();
    if (S.tab==="settings") renderSettingsView();
  }
});

renderTabs();
boot();
